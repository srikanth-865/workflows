name: nodejsEKs feature
on:
  workflow_call:
    inputs:
      project:
        description: 'Project name'
        required: true
        type: string
      component:
        description: 'Component name'
        required: true
        type: string
env:
 project: ${{ inputs.project }}
 component: ${{ inputs.component }}
jobs:
 build-nodejs:
  runs-on: ubuntu-latest
  steps:
  - name: code checkout
    uses: actions/checkout@v4
  - name: Listing files
    run: |
      ls -l